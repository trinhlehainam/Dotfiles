session: dotfiles
root: ~/.local/share/chezmoi
attach: true

windows:
  - name: workmux
    commands:
      - workmux dashboard --session --tab worktrees
  - name: main
    selected: true
    commands:
      - nvim
  - name: agents
    commands:
      - tmux set-window-option -t "$TMUX_PANE" automatic-rename off
      - tmux set-option -p -t "$TMUX_PANE" allow-rename off
      - herdr
